name: ci

# CI NEVER downloads bulk files and NEVER calls an external API.
# `just ci` runs entirely against the committed fixtures in tests/fixtures/, and
# DATA_MODE=fixture is set job-wide as a second guard: if a recipe ever forgot its
# --mode flag, the loaders still refuse to reach a publisher.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint
    runs-on: ubuntu-latest
    env:
      DATA_MODE: fixture
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Lint, format, and test
        run: just check

      - name: Fixture-mode load and L1 integrity
        run: just ci
