version: 2

models:
  - name: dim_date
    description: >
      Day-grain calendar, 1953-01-01 to 2029-12-31. **Only join this from a source that is
      genuinely daily** -- CFPB complaints and the NFIP date columns. Annual and
      survey-cycle sources join `dim_period` instead, which is what stops an annual figure
      from acquiring a day it never had (CLAUDE.md section 8). The span is set by the data:
      FEMA's earliest declaration is 1953-05-02 and NFIP policy terms run to 2029-08-29.
    config:
      contract:
        enforced: true
    columns:
      - name: date_day
        data_type: date
        description: The calendar day. Grain of this table.
        constraints: [{type: not_null}]
        data_tests: [unique]
      - name: date_key
        data_type: integer
        description: YYYYMMDD, for a compact join key.
        constraints: [{type: not_null}]
        data_tests: [unique]
      - name: calendar_year
        data_type: smallint
        description: >
          Four-digit calendar year.
        constraints: [{type: not_null}]
      - name: calendar_quarter
        data_type: tinyint
        description: >
          Quarter of the year, 1-4.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false
      - name: calendar_month
        data_type: tinyint
        description: >
          Month of the year, 1-12.
      - name: month_name
        data_type: varchar
        description: >
          Full month name, for a chart axis.
      - name: year_month
        data_type: varchar
        description: "`YYYY-MM`, matching `dim_period.period_key` at month grain."
      - name: year_quarter
        data_type: varchar
        description: >
          `YYYY-Qn`.
      - name: month_start
        data_type: date
        description: >
          First day of this date's month.
      - name: month_end
        data_type: date
        description: >
          Last calendar day of the month, the date the month-end snapshot is taken on.
      - name: quarter_start
        data_type: date
        description: >
          First day of this date's quarter.
      - name: year_start
        data_type: date
        description: >
          First year of the reporting window.
      - name: day_of_year
        data_type: smallint
        description: >
          Ordinal day within the year, 1-366.
      - name: iso_day_of_week
        data_type: tinyint
        description: >
          ISO weekday, Monday = 1 through Sunday = 7.
      - name: day_name
        data_type: varchar
        description: >
          Full weekday name.
      - name: iso_week
        data_type: tinyint
        description: >
          ISO week number. ISO rather than calendar, so week 1 is the week containing the first
          Thursday and no year has a stray part-week.
      - name: is_weekend
        data_type: boolean
        description: >
          Saturday or Sunday.
      - name: is_month_end
        data_type: boolean
        description: >
          Last calendar day of the month. This is the flag the policy in-force snapshot spine is
          built from.

  - name: dim_period
    description: >
      One row per reporting period at the grain its publisher actually reports.
      **This is where honest grain is structural rather than remembered.** A mart joins the
      rows of its own grain, so an annual measure has no monthly key available to be
      presented at -- not by convention, but because none exists for it. Grains: `month`
      (CPI-U, monthly rollups of CFPB), `year` (CMS 2014-2024, HMDA 2018-2025, ACS vintages,
      and back to 1913 because the CPI-U deflator does), and `survey_cycle` (CDC). Two of
      CDC's ten cycles span several years -- 2019-2022 and 2021-2022, 9,261 rows between
      them -- and `spans_multiple_years` flags them because a multi-year cycle describes its
      whole window and must never be plotted as a point on its final year.
    config:
      contract:
        enforced: true
    columns:
      - name: period_id
        data_type: varchar
        description: >
          `grain:period_key` -- `month:2019-01`, `year:2019`, `survey_cycle:2019`. Unique across
          all 1,051 rows, which `period_key` is not: eight years are also CDC survey cycles. SQL
          can join on grain and key together; a BI tool needs one column, and this is it.
      - name: grain
        data_type: varchar
        description: "`month`, `year` or `survey_cycle`. The grain a mart is declaring."
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values:
              arguments:
                values: ['month', 'year', 'survey_cycle']
      - name: period_key
        data_type: varchar
        description: Unique within a grain, never across grains -- 2024 is both a year and a cycle.
        constraints: [{type: not_null}]
      - name: period_start
        data_type: date
        description: >
          First day of the period.
        constraints: [{type: not_null}]
      - name: period_end
        data_type: date
        description: The last day the period covers. For a multi-year cycle this is years after the start.
        constraints: [{type: not_null}]
      - name: period_label
        data_type: varchar
        description: >
          How this period should be written on a chart.
      - name: calendar_year
        data_type: smallint
        description: >
          The final year of the window, and a label of convenience only. For a multi-year
          survey cycle it is **not** the year the estimate describes; check
          `spans_multiple_years` before using it as one.
      - name: spans_multiple_years
        data_type: boolean
        description: True where the period covers more than one calendar year. Every such row needs a caveat.

  - name: dim_state
    description: >
      The 56 states, DC and territories from `platform/reference/state_codes.csv` -- the same
      file `ingest.common.load_state_codes` reads and every L1 partition check rests on --
      plus the three postal areas that are none of those. Census region and division come
      with it, which is what INS-E2's national median and HLT-E1's peer comparison need.
    config:
      contract:
        enforced: true
    columns:
      - name: state_code
        data_type: varchar
        description: Two-letter postal code.
        constraints: [{type: not_null}]
        data_tests: [unique]
      - name: state_fips
        data_type: varchar
        description: >
          Two-digit FIPS, zero-padded. Alaska is `02`, and typing it as an integer breaks
          every join. NULL for the `UN` unknown-state member, which has no FIPS.
        data_tests: [unique]
      - name: state_name
        data_type: varchar
        description: >
          Full state name as published.
        constraints: [{type: not_null}]
      - name: entity_type
        data_type: varchar
        description: >
          `state` · `district` · `territory` · `military_post` · `freely_associated_state` ·
          `unknown`. Publishers mix these into one column as peers; this is what separates them.
        data_tests:
          - accepted_values:
              arguments:
                values: ['state', 'district', 'territory', 'freely_associated_state', 'military_post', 'unknown']
      - name: census_region
        data_type: varchar
        description: >
          Census region code, 1-4.
      - name: census_region_name
        data_type: varchar
        description: >
          `Northeast` · `Midwest` · `South` · `West`.
      - name: census_division
        data_type: varchar
        description: >
          Census division code, 1-9. Finer than region.
      - name: census_division_name
        data_type: varchar
        description: >
          Census division name. Michigan is `East North Central`, which is the Great Lakes peer
          group the drill bank compares against.
      - name: is_us_jurisdiction
        data_type: boolean
        description: >
          False for FM, MH and PW -- sovereign nations with US postal service rather than US
          territories, which is why they are absent from the state reference and why the
          ingestion layer counts them as nonstandard partition keys, deliberately. NULL for
          the `UN` member, where the question has no answer.
      - name: is_michigan
        data_type: boolean
        description: >
          The Michigan lens, applied at the point of use rather than baked into the grain.
          National rows are retained so Michigan has a benchmark.

  - name: dim_geography_county
    description: >
      Every county key any landed source references, national. Built from all fifteen ACS
      vintages rather than the newest, because the 2022 vintage replaced Connecticut's eight
      counties with nine planning regions and Alaska has split boroughs twice -- so a roster
      from the current vintage alone leaves 18 NFIP keys, 65 CMS keys and 11 HUD keys with
      nowhere to join. Three populations ACS will never contain are added and labelled:
      the `XX000` unassigned buckets, the island areas (NFIP has 3,513 claims there, and
      INS-E5 ties to FEMA totals that include them), and codes retired before 2010.
      National on purpose -- a Michigan-only dimension would force a `WHERE state = 'MI'`
      inside a mart, which CLAUDE.md section 4 calls the likeliest scope bug in the repo.
    config:
      contract:
        enforced: true
    columns:
      - name: county_fips
        data_type: varchar
        description: Five-digit state+county FIPS as every publisher here writes it. Grain of this table.
        constraints: [{type: not_null}]
        data_tests: [unique]
      - name: state_fips
        data_type: varchar
        description: >
          Two-digit state FIPS, as text. Alaska is `02`; typed as a number it silently stops
          joining.
        constraints: [{type: not_null}]
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_fips
      - name: county_fips_3
        data_type: varchar
        description: The county half alone, which is how ACS stores it.
      - name: state_code
        data_type: varchar
        description: >
          Two-letter postal code. Joins `dim_state`.
      - name: state_name
        data_type: varchar
        description: >
          Full state name as published.
      - name: county_name
        data_type: varchar
        description: >
          Bare name for an axis label. NULL where no publisher here names the geography --
          most island areas. The unassigned buckets carry CMS's own `XX-UNKNOWN` label.
      - name: county_name_full
        data_type: varchar
        description: As ACS published it, e.g. "Alcona County, Michigan". NULL outside the ACS roster.
      - name: geography_kind
        data_type: varchar
        description: >
          `county` · `unknown_county` (the XX000 bucket) · `island_area` (ACS county files omit
          these) · `retired` (a code no longer published). Only `county` is a reportable county.
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values:
              arguments:
                values: ['county', 'unknown_county', 'island_area', 'retired']
      - name: is_reportable_county
        data_type: boolean
        description: >
          True only for `county`. **This is the filter a county-grain measure wants** --
          it excludes the unassigned buckets and the unnamed island areas without dropping
          them from the dimension, so a denominator can state what it left out.
      - name: is_michigan
        data_type: boolean
        description: 84 rows -- Michigan's 83 counties plus its `26000` unassigned bucket.
      - name: first_vintage
        data_type: varchar
        description: >
          Earliest ACS vintage this county appears in.
      - name: last_vintage
        data_type: varchar
        description: The most recent ACS vintage naming this FIPS. 2021 for Connecticut's old counties.
      - name: is_current_vintage
        data_type: boolean
        description: >
          False means the boundary moved. Connecticut's counties and Alaska's retired
          census areas read False, and that is a boundary change rather than a data error.
      - name: geography_note
        data_type: varchar
        description: >
          Why a non-county key exists, where a seed records it.

seeds:
  - name: seed_survey_cycles
    description: >
      CDC's ten Alzheimer's & Healthy Aging survey cycles. Seeded rather than derived from
      the CDC table so a conformed dimension does not reach into a track's source for its own
      definition; the health staging PR adds the test that this still matches what CDC
      publishes.
    columns:
      - name: cycle_key
        description: >
          CDC survey cycle. Eight of the ten are single years; `2019-2022` and `2021-2022` are
          not.
        data_tests: [unique, not_null]

  - name: seed_areas
    description: >
      Postal areas that appear in published data but are not US states, districts or
      territories, so they are absent from `state_codes.csv` by design -- the ingestion layer
      counts them as nonstandard partition keys and warns, which is the behaviour we want.
      Two kinds: the freely associated states (Micronesia, the Marshall Islands, Palau),
      established while landing the HUD crosswalk which serves them; and the three military
      post codes (AA, AE, AP) that CFPB files 4,267 complaints under.
    columns:
      - name: state_fips
        description: >
          Two-digit state FIPS, as text. Alaska is `02`; typed as a number it silently stops
          joining.
        data_tests: [unique, not_null]
      - name: state_code
        description: >
          Two-letter postal code. Joins `dim_state`.
        data_tests: [unique, not_null]

  - name: seed_county_exceptions
    description: >
      County keys that landed data references and no ACS vintage names, where another
      publisher does name them. Only the three US Virgin Islands counties qualify today, from
      CMS Geographic Variation. Everything else unnamed stays NULL rather than being invented.
    columns:
      - name: county_fips
        description: >
          Five-digit state+county FIPS. Joins `dim_geography_county`. NULL where the publisher
          reported no county, which is a real category and not a load failure.
        data_tests: [unique, not_null]
