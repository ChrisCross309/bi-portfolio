version: 2

# Contracts are enforced from here on, and the column types below are generated from the
# built models rather than typed by hand.
#
# A mart is an interface: session 3 reads these into Power BI, and a column that silently
# changes type between refreshes breaks a report at a moment when nobody is looking at the
# pipeline. Staging stays uncontracted because it is internal to this project -- the same
# split PRs 4 through 6 made, now with the other side of it filled in.

models:
  - name: fct_ins_claims_monthly
    description: >
      **INS-E1 · INS-E2.** Flood claims by county and loss month, national. Michigan is a
      filter on `is_michigan`, not a property of the grain, so the national benchmark INS-E2
      needs comes from the same table. Carries the seasonality and top-county drills.
    columns:
      - name: loss_year
        data_type: smallint
        description: >
          Calendar year the flood loss occurred, not the year the claim was paid.
        data_tests: [not_null]
      - name: loss_month
        data_type: tinyint
        description: >
          Calendar month of loss, 1-12. Carries the seasonality drill.
      - name: loss_year_month
        data_type: varchar
        description: >
          `YYYY-MM` of the loss date. Joins `dim_period` at month grain.
      - name: loss_year_key
        data_type: varchar
        description: >
          `loss_year` as text, for joining `dim_period` at year grain.
      - name: state_code
        data_type: varchar
        description: >
          Two-letter postal code. Joins `dim_state`.
      - name: county_fips
        data_type: varchar
        description: >
          Five-digit state+county FIPS. Joins `dim_geography_county`. NULL where the publisher
          reported no county, which is a real category and not a load failure.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_geography_county')
                field: county_fips
      - name: county_name
        data_type: varchar
        description: >
          County name without the state suffix, for a chart axis. The unassigned bucket reads
          `XX-UNKNOWN` rather than blank.
      - name: state_name
        data_type: varchar
        description: >
          Full state name as published.
      - name: is_michigan
        data_type: boolean
        description: >
          The Michigan lens, applied at the point of use rather than baked into the grain.
          National rows are retained so Michigan has a benchmark.
      - name: is_state_unknown
        data_type: boolean
        description: >
          The publisher reported no state for these claims. Kept rather than dropped, so a
          national total still reconciles.
      - name: rated_flood_zone
        data_type: varchar
        description: >
          The flood zone the policy was rated on, which is what determined the premium. National
          for the first time -- this was Michigan-only until the characteristics landed here.
      - name: flood_zone_current
        data_type: varchar
        description: >
          The flood zone currently mapped at the property. Differs from `rated_flood_zone` where
          the map was revised after the policy was written, which is what the non-SFHA-share drill
          turns on.
      - name: occupancy_type
        data_type: smallint
        description: >
          NFIP occupancy code -- single family, two-to-four family, other residential,
          non-residential.
      - name: pre_firm_indicator
        data_type: boolean
        description: >
          The building predates its community's first Flood Insurance Rate Map, so it was never
          built to the flood standard.
      - name: post_firm_construction_indicator
        data_type: boolean
        description: >
          The building was constructed after its community's first Flood Insurance Rate Map.
      - name: crs_class_code
        data_type: smallint
        description: >
          Community Rating System class, 1-10. A lower class means the community does more
          floodplain management and its policyholders get a larger premium discount.
      - name: claim_count
        data_type: bigint
        description: >
          Claims with a loss date in this month and county. Every claim, including those that
          closed without payment.
      - name: closed_without_payment_count
        data_type: bigint
        description: >
          Claims closed with nothing paid. The reason gross and net severity differ.
      - name: zero_paid_count
        data_type: bigint
        description: >
          Claims where the paid total came to zero.
      - name: no_county_count
        data_type: bigint
        description: >
          Claims in this group whose county could not be resolved from either key.
      - name: paid_building
        data_type: decimal(38,2)
        description: >
          Paid on the building claim, nominal dollars.
      - name: paid_contents
        data_type: decimal(38,2)
        description: >
          Paid on the contents claim, nominal dollars.
      - name: paid_icc
        data_type: decimal(38,2)
        description: >
          Paid on the Increased Cost of Compliance claim, nominal dollars.
      - name: paid_total
        data_type: decimal(38,2)
        description: >
          Gross, so NULL-paid claims are skipped rather than counted as zero. `net_paid_total`
          makes the opposite choice. Staging carries both because they answer different
          questions and neither is right in general.
      - name: net_paid_total
        data_type: decimal(38,2)
        description: >
          Net of recoveries, nominal dollars. Counts a claim closed without payment as zero, where
          the gross measure skips it. Both are carried because they answer different questions.
      - name: building_coverage
        data_type: hugeint
        description: >
          Total building insurance coverage on these claims -- exposure, not a payment.
      - name: contents_coverage
        data_type: hugeint
        description: >
          Total contents insurance coverage on these claims -- exposure, not a payment.
      - name: avg_paid_per_claim
        data_type: double
        description: >
          Severity. NULL rather than zero where nothing paid, so an average is over claims that
          actually paid. Recompute from `paid_total` and `claim_count` before aggregating -- this
          column cannot be summed or averaged.
      - name: paid_total_constant
        data_type: double
        description: >
          **INS-E2.** Restated in constant dollars of the deflator base year using CPI-U's
          unadjusted annual average. NULL for any year BLS has not published one for -- 2026
          has none, so it has no constant-dollar figure rather than a silently nominal one.
      - name: avg_paid_per_claim_constant
        data_type: double
        description: >
          Severity in constant dollars. Same rule: recompute from the components rather than
          aggregating this column.
      - name: is_complete_loss_year
        data_type: boolean
        description: >
          The loss year is over. The file runs to July 2026, so 2026 is partial and plotting
          it beside a full year shows a collapse that is an artifact of the download date.
      - name: is_development_mature
        data_type: boolean
        description: >
          Twelve months have passed since the year ended. A flood claim is not paid the day
          it is filed -- nationally the median gap from loss to last payment is 45-60 days and
          the 90th percentile runs 140-220 -- so **the most recent complete year always
          understates itself**. INS-E1 asks for the latest complete year; this is the flag
          that says whether that year has finished settling. With data through July 2026,
          2025 is complete and not yet mature.
      - name: county_population
        data_type: bigint
        description: >
          ACS county population, the denominator for per-capita paid. **Never sum it**: it repeats
          across every characteristic row of a county-month, because population is a property of
          the county and not of the flood zone. Take MAX within a county-month, or aggregate the
          rate's components instead.
      - name: population_vintage_window
        data_type: varchar
        description: >
          Which ACS five-year window the population came from. Exactly one vintage per loss year
          -- the estimate ending in that year -- because the windows overlap and matching on
          containment fans the join out.
      - name: population_is_extrapolated
        data_type: boolean
        description: >
          The loss year falls outside ACS's published range, so the nearest vintage was used. TRUE
          for every loss year before 2010, which is most of the file: NFIP claims start in 1978
          and ACS does not. A per-capita rate on those years is indicative, not measured.
      - name: is_small_cell
        data_type: boolean
        description: >
          Fewer than ten claims. The insurance README's display rule: show the count beside
          the rate, and grey a rate built on a handful rather than publishing a number that
          looks precise. A 100% loss rate drawn from one claim is misleading regardless of
          privacy.

  - name: fct_ins_claims_detail_mi
    description: >
      Michigan claims at claim grain, roughly 14,900 rows. Every drill needing a single claim
      lives here; the national picture stays aggregated because 2.7M rows at claim grain is a
      mart nobody queries and a Power BI model nobody refreshes. The split is the Michigan
      lens expressed as grain rather than as a filter.
    columns:
      - name: claim_id
        data_type: bigint
        description: >
          NFIP's own claim identifier. Unique in the detail table; repeated in the bridge, where
          one claim may match more than one disaster.
        data_tests: [unique, not_null]
      - name: county_fips
        data_type: varchar
        description: >
          Five-digit state+county FIPS. Joins `dim_geography_county`. NULL where the publisher
          reported no county, which is a real category and not a load failure.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_geography_county')
                field: county_fips
      - name: is_spring_melt_season
        data_type: boolean
        description: >
          March through May. **Michigan's flood year is not the national one** -- it peaks on
          snowmelt and spring convective storms while the national profile peaks August
          through October on hurricanes. A month-over-month comparison of the two compares two
          different physical processes and reads as Michigan being anomalous when it is simply
          inland.
      - name: county_name
        data_type: varchar
        description: >
          County name without the state suffix, for a chart axis. The unassigned bucket reads
          `XX-UNKNOWN` rather than blank.
      - name: has_usable_county
        data_type: boolean
        description: >
          Whether a county resolved from either `countyCode` or `censusGeoid`. The models coalesce
          the two; reading only the second overstates the gap.
      - name: county_matches_reported_state
        data_type: boolean
        description: >
          Whether the resolved county sits in the state the claim reports. FALSE flags a publisher
          inconsistency rather than a load error.
      - name: date_of_loss
        data_type: date
        description: >
          Date the flood loss occurred. Joins `dim_date`.
      - name: loss_year
        data_type: smallint
        description: >
          Calendar year the flood loss occurred, not the year the claim was paid.
      - name: loss_month
        data_type: tinyint
        description: >
          Calendar month of loss, 1-12. Carries the seasonality drill.
      - name: loss_year_month
        data_type: varchar
        description: >
          `YYYY-MM` of the loss date. Joins `dim_period` at month grain.
      - name: amount_paid_on_building_claim
        data_type: decimal(12,2)
        description: >
          Paid on the building claim, nominal dollars.
      - name: amount_paid_on_contents_claim
        data_type: decimal(12,2)
        description: >
          Paid on the contents claim, nominal dollars.
      - name: amount_paid_on_icc_claim
        data_type: decimal(12,2)
        description: >
          Paid on the Increased Cost of Compliance claim, nominal dollars.
      - name: total_amount_paid
        data_type: decimal(14,2)
        description: >
          Building, contents and ICC paid together, in nominal dollars. Gross: it excludes claims
          closed without payment rather than counting them as zero.
      - name: total_net_payment
        data_type: decimal(14,2)
        description: >
          Net payment after recoveries, nominal dollars.
      - name: is_closed_without_payment
        data_type: boolean
        description: >
          The claim closed with nothing paid. A real outcome, not a missing value.
      - name: is_zero_paid
        data_type: boolean
        description: >
          The paid total came to exactly zero.
      - name: has_negative_payment
        data_type: boolean
        description: >
          A negative amount, which FEMA's own documentation allows where a recovery exceeded a
          payment. Kept as published.
      - name: total_amount_paid_constant
        data_type: double
        description: >
          Paid total in constant dollars of the deflator base year.
      - name: rated_flood_zone
        data_type: varchar
        description: >
          The flood zone the policy was rated on, which is what determined the premium.
      - name: flood_zone_current
        data_type: varchar
        description: >
          The flood zone currently mapped at the property. Differs from `rated_flood_zone` where
          the map has been revised since the policy was written.
      - name: occupancy_type
        data_type: smallint
        description: >
          NFIP occupancy code -- single family, two-to-four family, other residential,
          non-residential.
      - name: crs_class_code
        data_type: smallint
        description: >
          Community Rating System class, 1-10. A lower class means the community does more
          floodplain management and its policyholders get a larger premium discount.
      - name: pre_firm_indicator
        data_type: boolean
        description: >
          The building predates its community's first Flood Insurance Rate Map, so it was never
          built to the flood standard.
      - name: post_firm_construction_indicator
        data_type: boolean
        description: >
          The building was constructed after its community's first Flood Insurance Rate Map.
      - name: foundation_type
        data_type: varchar
        description: >
          Foundation as reported -- basement, crawlspace, slab, elevated.
      - name: water_depth
        data_type: smallint
        description: >
          Water depth as reported, in feet relative to the first floor. Negative means the water
          stayed below it.
      - name: exterior_water_depth
        data_type: integer
        description: >
          Water depth outside the building, in inches.
      - name: interior_water_depth
        data_type: integer
        description: >
          Water depth inside the building, in inches.
      - name: building_damage_amount
        data_type: integer
        description: >
          Assessed building damage, which is not the same as the amount paid: coverage limits and
          deductibles sit between them.
      - name: contents_damage_amount
        data_type: integer
        description: >
          Assessed contents damage. Same caveat as building damage.
      - name: total_building_insurance_coverage
        data_type: integer
        description: >
          Building coverage carried on the policy -- the exposure, not a payment.
      - name: total_contents_insurance_coverage
        data_type: integer
        description: >
          Contents coverage carried on the policy -- the exposure, not a payment.
      - name: number_of_floors_in_the_insured_building
        data_type: smallint
        description: >
          Floors in the insured building, as coded by NFIP.
      - name: primary_residence_indicator
        data_type: boolean
        description: >
          The insured building is the policyholder's primary residence.
      - name: rental_property_indicator
        data_type: boolean
        description: >
          The insured building is a rental property.
      - name: elevated_building_indicator
        data_type: boolean
        description: >
          The building is elevated above grade, a mitigation measure that changes both risk and
          rating.
      - name: nfip_community_name
        data_type: varchar
        description: >
          The NFIP community the property sits in. Communities, not counties, are what join the
          CRS programme.
      - name: reported_city
        data_type: varchar
        description: >
          City as reported on the claim.
      - name: reported_zip_code
        data_type: varchar
        description: >
          ZIP as reported. Uses the **empty string** where absent, while `censusGeoid` uses NULL
          -- same publisher, same file, two conventions.
      - name: open_date
        data_type: date
        description: >
          Date the claim was opened.
      - name: most_recent_payment_date
        data_type: date
        description: >
          Date of the last payment on the claim. NULL where nothing was ever paid.
      - name: days_loss_to_last_payment
        data_type: integer
        description: >
          Days from loss to final payment. This is the development lag that makes a recent loss
          year understate itself: the national median runs 45-60 days and the 90th percentile
          140-220.

  - name: fct_ins_policies_mi_monthly
    description: >
      **INS-E4.** Michigan policies in force at each month end, by county, expanded from
      effective and termination dates because the file carries no in-force flag.
    columns:
      - name: policies_in_force
        data_type: hugeint
        description: >
          **`SUM(policy_count)`, never `COUNT(*)`.** A condominium master policy covers many
          units in one record, so Michigan's book is about 6% larger than its row count and
          the gap moves with the condo mix. `policy_records` is published beside it so the
          difference is visible rather than a discrepancy someone has to chase.
        data_tests: [not_null]
      - name: county_fips
        data_type: varchar
        description: >
          Five-digit state+county FIPS. Joins `dim_geography_county`. NULL where the publisher
          reported no county, which is a real category and not a load failure.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_geography_county')
                field: county_fips
      - name: month_end
        data_type: date
        description: >
          Last calendar day of the month, the date the month-end snapshot is taken on.
      - name: year_month
        data_type: varchar
        description: >
          `YYYY-MM`. Joins `dim_period` at month grain.
      - name: calendar_year
        data_type: smallint
        description: >
          Four-digit calendar year.
      - name: county_name
        data_type: varchar
        description: >
          County name without the state suffix, for a chart axis. The unassigned bucket reads
          `XX-UNKNOWN` rather than blank.
      - name: is_michigan
        data_type: boolean
        description: >
          The Michigan lens, applied at the point of use rather than baked into the grain.
          National rows are retained so Michigan has a benchmark.
      - name: policy_records
        data_type: bigint
        description: >
          Underlying policy records. Not the same as policies -- see `policies_in_force`.
      - name: premium_in_force
        data_type: hugeint
        description: >
          Total premium on policies in force at month end.
      - name: building_coverage_in_force
        data_type: hugeint
        description: >
          Total building coverage in force at month end.
      - name: contents_coverage_in_force
        data_type: hugeint
        description: >
          Total contents coverage in force at month end.
      - name: policy_cost_in_force
        data_type: hugeint
        description: >
          Total policy cost in force at month end.
      - name: policies_beyond_records
        data_type: hugeint
        description: >
          How many more policies than records this group holds -- the condominium gap, made
          visible so the sum-not-count rule can be checked rather than trusted.
      - name: is_small_cell
        data_type: boolean
        description: >
          Fewer than ten underlying records. A rate built on this many swings wildly; show the
          count beside it or grey it out rather than publishing a number that looks precise.

  - name: dim_ins_disaster_declaration
    description: >
      One row per federally declared disaster, collapsed from 70,184 declaration-area rows to
      5,239 disasters. Counting declarations here is counting rows; counting them in the
      source is not, and the difference is a factor of thirteen.
    columns:
      - name: disaster_number
        data_type: smallint
        description: >
          FEMA's disaster number. Joins `dim_ins_disaster_declaration`.
        data_tests: [unique, not_null]
      - name: is_incident_open
        data_type: boolean
        description: >
          Any area of the disaster still open, in which case `incident_end_date` is NULL. A
          `BETWEEN` against a NULL end matches nothing silently, which is why the flag exists.
      - name: fema_declaration_string
        data_type: varchar
        description: >
          FEMA's own composite declaration identifier, as published.
      - name: declaration_type
        data_type: varchar
        description: >
          FEMA declaration type: `DR` major disaster, `EM` emergency, `FM` fire management.
      - name: declaration_title
        data_type: varchar
        description: >
          FEMA's own title for the declared event.
      - name: incident_type
        data_type: varchar
        description: >
          FEMA's classification of the incident. **A declared disaster is not automatically a
          flood event** -- attribution is restricted to flood-related types for exactly this
          reason.
      - name: declaration_date
        data_type: date
        description: >
          Date the disaster was declared, which is not the date the incident began.
      - name: incident_begin_date
        data_type: date
        description: >
          First day of the declared incident window.
      - name: incident_end_date
        data_type: date
        description: >
          Last day of the declared incident window. NULL while the incident is still open.
      - name: has_invalid_incident_window
        data_type: boolean
        description: >
          The incident ends before it begins. Two rows, kept as published and flagged rather than
          silently corrected.
      - name: designated_area_count
        data_type: bigint
        description: >
          Declaration rows for this disaster -- one per designated area. The reason 70,184 raw
          rows collapse to 5,239 disasters.
      - name: designated_county_count
        data_type: bigint
        description: >
          Distinct counties this disaster designated.
      - name: statewide_area_count
        data_type: bigint
        description: >
          Designations naming no county. A statewide declaration covers everywhere in the state,
          which is why attribution has to handle it separately.
      - name: state_count
        data_type: bigint
        description: >
          How many states this disaster touched.
      - name: is_flood_related
        data_type: boolean
        description: >
          Flood, severe storm, or dam/levee break. **The condition that stops attribution being
          nonsense**: without it, FEMA's statewide COVID-19 declaration ran 2020-2023 and matched
          every Michigan flood claim in that span -- 13,541 of them, attributed to a pandemic.
      - name: is_major_disaster
        data_type: boolean
        description: >
          Declaration type `DR`, the major-disaster instrument, as against an emergency or
          fire-management declaration.
      - name: touches_michigan
        data_type: boolean
        description: >
          This disaster designated at least one Michigan area.
      - name: ia_program_declared
        data_type: boolean
        description: >
          Individual Assistance was declared -- aid to households and individuals.
      - name: pa_program_declared
        data_type: boolean
        description: >
          Public Assistance was declared -- aid to governments and certain non-profits for
          infrastructure.

  - name: bridge_ins_claim_declaration
    description: >
      **INS-E3.** Which Michigan claims fall inside which declared flood disaster. Inferred,
      not published -- FEMA declares disasters and NFIP pays claims and the two files share no
      key -- so the rule is stated in the model and every number built on it inherits the
      caveat. **This is a bridge, not a lookup: a claim can match more than one disaster**
      (3,821 rows across 3,574 distinct claims), so a naive join through it double counts paid
      dollars. Sum over distinct claims, or take the earliest match, and say which.
    columns:
      - name: claim_id
        data_type: bigint
        description: >
          NFIP's own claim identifier. Unique in the detail table; repeated in the bridge, where
          one claim may match more than one disaster.
        data_tests: [not_null]
      - name: incident_type
        data_type: varchar
        description: >
          **Only flood-related declarations attribute.** Without that restriction this model
          reported 100% of Michigan losses as event-driven in 2021 and 2022, which looked like
          a finding and was an artifact: FEMA declared COVID-19 a statewide Michigan disaster
          running 2020-01-20 to 2023-05-11, and it matched every Michigan flood claim in those
          three years. A declaration is a legal instrument, not a description of the weather.
      - name: grace_window_days
        data_type: integer
        description: >
          How long after an incident ends a loss may still be attributed to it. A variable
          rather than a literal because INS-E3's answer moves with it, which is exactly why
          the drill bank asks for 30, 60 and 90 rather than one number.
      - name: county_fips
        data_type: varchar
        description: >
          Five-digit state+county FIPS. Joins `dim_geography_county`. NULL where the publisher
          reported no county, which is a real category and not a load failure.
      - name: date_of_loss
        data_type: date
        description: >
          Date the flood loss occurred. Joins `dim_date`.
      - name: loss_year
        data_type: smallint
        description: >
          Calendar year the flood loss occurred, not the year the claim was paid.
      - name: total_amount_paid
        data_type: decimal(14,2)
        description: >
          Building, contents and ICC paid together, in nominal dollars. Gross: it excludes claims
          closed without payment rather than counting them as zero.
      - name: disaster_number
        data_type: smallint
        description: >
          FEMA's disaster number. Joins `dim_ins_disaster_declaration`.
      - name: declaration_type
        data_type: varchar
        description: >
          FEMA declaration type: `DR` major disaster, `EM` emergency, `FM` fire management.
      - name: declaration_title
        data_type: varchar
        description: >
          FEMA's own title for the declared event.
      - name: incident_begin_date
        data_type: date
        description: >
          First day of the declared incident window.
      - name: incident_end_date
        data_type: date
        description: >
          Last day of the declared incident window. NULL while the incident is still open.
      - name: matched_via_statewide_declaration
        data_type: boolean
        description: >
          The disaster designated no county and was declared statewide, so it matches every
          Michigan claim in its window. 1,605 declaration rows name no county and would otherwise
          attribute nothing at all.
      - name: incident_duration_days
        data_type: integer
        description: >
          Length of the declared incident window in days.
      - name: days_into_incident
        data_type: integer
        description: >
          Days from the incident's start to the loss date. Negative is impossible here; larger
          than `incident_duration_days` means the loss fell in the grace window.
      - name: is_in_grace_window
        data_type: boolean
        description: >
          The loss happened after the declared incident ended but within the grace window -- a
          flood that begins on the last declared day does not stop that night.

  - name: rpt_ins_reconciliation
    description: >
      **INS-E5: do our totals tie to FEMA's published figures?** The only question in the set
      whose answer lives outside the warehouse -- FEMA's own count is not a column anywhere,
      it is what the API reported when the bulk file was downloaded, which the ingestion layer
      wrote into the source manifest for exactly this purpose.
    columns:
      - name: source_name
        data_type: varchar
        description: >
          Which ingested source this row reconciles.
        data_tests: [not_null]
      - name: publisher_to_landing_gap
        data_type: bigint
        description: >
          FEMA reported 2,724,656 claims and served a bulk file containing 2,724,014. Counts
          and bulk files are generated at different moments, so this gap is **timing, not a
          defect** -- L1 already classifies it that way using the two refresh timestamps.
      - name: warehouse_to_mart_gap
        data_type: hugeint
        description: >
          A gap here would be ours and would be a defect. Asserted zero by a test rather than
          left to be noticed.
      - name: measure_label
        data_type: varchar
        description: >
          What is being counted, in words, so the figure is not mistaken for a different unit.
      - name: publisher_figure
        data_type: bigint
        description: >
          The count the publisher's own API reported at download time. NULL where the endpoint
          refuses a count for the filter.
      - name: rows_landing
        data_type: bigint
        description: >
          Rows in the as-downloaded landing files.
      - name: rows_raw
        data_type: bigint
        description: >
          Rows in the canonical raw parquet.
      - name: rows_duckdb
        data_type: bigint
        description: >
          Rows in the DuckDB raw table.
      - name: rows_staged
        data_type: bigint
        description: >
          Rows in the typed staging view.
      - name: rows_in_mart
        data_type: hugeint
        description: >
          Rows, or summed counts, reaching the mart.
      - name: retrieved_at
        data_type: timestamp
        description: >
          When this source was downloaded, UTC.
      - name: source_last_refresh
        data_type: timestamp
        description: >
          When the publisher says it last refreshed the data.
      - name: source_metadata_refresh
        data_type: timestamp
        description: >
          When the publisher's metadata was last refreshed, which can differ from the data's own
          timestamp and is what distinguishes lag from a real gap.
      - name: interpretation
        data_type: varchar
        description: >
          A sentence stating how to read this row, carried in the data so a figure cannot be
          quoted without its caveat.
