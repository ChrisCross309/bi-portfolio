version: 2

# Contracts enforced, and the column types below are generated from the built models
# rather than typed by hand -- the same split PRs 7 and 8 made.
#
# Every model here carries the track's standing warnings in its own description, because
# a reader arrives at one model and not at a preamble: these are aggregate files where a
# row is a cell and never a person, nothing in them sums to a patient count, and it is
# public aggregate data only -- no PHI, no re-identification, no individual-level
# inference.
#
# And the one that is not optional: **neither HLT-E2 nor HLT-E3 measures dementia.** The
# source that carried dementia prevalence and dementia-attributable spending at county
# grain was retired by CMS effective 2026-06-15; both questions were re-scoped onto
# Medicare Geographic Variation keeping their IDs, and they are care-burden and cost
# measures. The track's genuinely cognitive content is HLT-E1 and HLT-E4, from CDC.

models:
  - name: fct_hlt_cdc_mi_vs_national
    description: >
      **HLT-E1 - HLT-E4.** Michigan beside the national estimate for every CDC indicator,
      compared on **confidence intervals rather than point estimates**: two are treated as
      distinguishable only when they do not overlap, so the model is allowed to return *no
      significant difference*, and on subjective cognitive decline it does so in all 24
      comparable cells. That is the finding, not a failure to find one. A row is a cell, never a
      person. Direction over the prior cycle is withheld wherever an endpoint carries CDC's `**`
      footnote -- estimates before and after 2019 are not comparable because the survey
      questions changed -- or wherever the cycle spans several years.
    columns:
      - name: cycle_key
        data_type: varchar
        description: >
          CDC survey cycle. Eight of the ten are single years; `2019-2022` and `2021-2022` are
          not.
        data_tests:
          - not_null
      - name: period_id
        data_type: varchar
        description: >
          The single-column key a BI relationship needs. `grain:period_key`, because
          `period_key` alone is **not unique** -- 2015 through 2022 each exist as both a
          calendar year and a CDC survey cycle. Joins `dim_period.period_id`.
      - name: year_start
        data_type: smallint
        description: >
          First year of the reporting window.
      - name: year_end
        data_type: smallint
        description: >
          Last year of the reporting window. Equal to `year_start` for a single-year period.
      - name: spans_multiple_years
        data_type: boolean
        description: >
          TRUE where the period covers several years. A multi-year estimate describes its whole
          window and must never be plotted as a point on its final year.
      - name: question_id
        data_type: varchar
        description: >
          CDC question code. Joins `seed_cdc_indicator_catalog`.
        data_tests:
          - not_null
      - name: question
        data_type: varchar
        description: >
          CDC's own full question wording, as published.
      - name: class_id
        data_type: varchar
        description: >
          CDC class code -- `C06` Cognitive Decline, `C07` Caregiving, `C03` Screenings and
          Vaccines.
      - name: class
        data_type: varchar
        description: >
          CDC indicator class, the top level of its taxonomy.
      - name: indicator_family
        data_type: varchar
        description: >
          `cognitive_decline` · `caregiving` · `screening` · `overall_health` ·
          `nutrition_activity` · `substance_use` · `mental_health`.
      - name: short_label
        data_type: varchar
        description: >
          A chart-length label for the indicator, from the seed. CDC's own wording runs to a
          paragraph.
      - name: higher_is_better
        data_type: boolean
        description: >
          Whether a rise in this indicator is good news. **NULL where CDC's wording does not
          settle it** -- caregiving prevalence is genuinely two-sided -- and every direction
          downstream is NULL when it is.
      - name: is_cognitive_decline
        data_type: boolean
        description: >
          The Cognitive Decline class, which HLT-E1 draws on.
      - name: is_caregiving
        data_type: boolean
        description: >
          The Caregiving class, which HLT-E4 draws on. **The only class carrying CDC's 2019
          comparability break.**
      - name: is_screening
        data_type: boolean
        description: >
          The Screenings and Vaccines class, which HLT-E5's capacity side draws on.
      - name: age_group
        data_type: varchar
        description: >
          `50-64 years` · `65 years or older` · `Overall`. This source covers adults **50 and
          older**, not 45 and older.
      - name: stratification
        data_type: varchar
        description: >
          The second stratification dimension -- a race/ethnicity or sex band, or `Overall` where
          the cell is unstratified.
      - name: is_unstratified_second_dimension
        data_type: boolean
        description: >
          TRUE on the `Overall` cells. Summing across the stratified ones double counts the
          population.
      - name: mi_value
        data_type: double
        description: >
          Michigan's published estimate.
      - name: mi_low
        data_type: double
        description: >
          Lower confidence limit on the Michigan estimate.
      - name: mi_high
        data_type: double
        description: >
          Upper confidence limit on the Michigan estimate.
      - name: national_value
        data_type: double
        description: >
          The national figure for the same period and measure, carried beside the local one so a
          benchmark needs no second query.
      - name: national_low
        data_type: double
        description: >
          Lower confidence limit on the national estimate.
      - name: national_high
        data_type: double
        description: >
          Upper confidence limit on the national estimate.
      - name: gap_to_national
        data_type: double
        description: >
          Local value minus national, in the measure's own units. Positive means above national,
          which is not the same as better.
      - name: national_fewer_than_50_states
        data_type: boolean
        description: >
          The national side was built from fewer than 50 states reporting.
      - name: mi_not_comparable_pre_2019
        data_type: boolean
        description: >
          Michigan's estimate carries CDC's 2019 comparability break.
      - name: national_not_comparable_pre_2019
        data_type: boolean
        description: >
          The national estimate carries CDC's 2019 comparability break.
      - name: is_comparable
        data_type: boolean
        description: >
          Both sides present and both carrying a confidence interval. Anything less is not a
          comparison; Michigan publishes no 2016 cognitive-decline row, so 2016 is stated as
          `not comparable` rather than left as a gap.
      - name: intervals_overlap
        data_type: boolean
        description: >
          The two confidence intervals overlap, so the estimates are **not** distinguishable. This
          is the whole test behind HLT-E1.
      - name: significance
        data_type: varchar
        description: >
          The raw comparison: `MI higher` - `MI lower` - `no significant difference` - `not
          comparable`. Overlapping intervals are **not** a difference.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'MI higher'
                  - 'MI lower'
                  - 'no significant difference'
                  - 'not comparable'
      - name: benchmark_verdict
        data_type: varchar
        description: >
          `significance` with the indicator's polarity applied. NULL where the seed leaves
          `higher_is_better` empty, because there is then no such thing as better.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'MI better'
                  - 'MI worse'
                  - 'no significant difference'
                  - 'not comparable'
      - name: prior_cycle_key
        data_type: varchar
        description: >
          The previous single-year cycle this row's change is measured against. Multi-year cycles
          are levels, never trend endpoints.
      - name: mi_prior_value
        data_type: double
        description: >
          Michigan's estimate in the prior single-year cycle.
      - name: mi_change_from_prior
        data_type: double
        description: >
          Change in percentage points from the prior cycle. NULL wherever an endpoint straddles
          the 2019 question change or the cycle spans several years.
      - name: mi_direction
        data_type: varchar
        description: >
          Michigan against its own prior **single-year** cycle. NULL for multi-year cycles and
          `not comparable` across the 2019 survey-question change.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'improving'
                  - 'deteriorating'
                  - 'no significant change'
                  - 'not comparable'

  - name: fct_hlt_cdc_indicators
    description: >
      Every CDC Alzheimer's & Healthy Aging indicator cell, typed, catalogued and flagged; the
      level table behind HLT-E1, HLT-E4 and HLT-E5's indicator side. **A row is a cell --
      indicator by place by cycle by stratification -- never a person**, and nothing here sums
      to a patient count. Covers **adults 50 and older**: the only strata CDC publishes are
      50-64, 65 or older, and Overall. **State grain only; this source has no county at all.**
      `location_kind` is what stops a sum across states, regions and the nation at once.
    columns:
      - name: cycle_key
        data_type: varchar
        description: >
          CDC survey cycle. Eight of the ten are single years; `2019-2022` and `2021-2022` are
          not.
        data_tests:
          - not_null
      - name: period_id
        data_type: varchar
        description: >
          The single-column key a BI relationship needs. `grain:period_key`, because
          `period_key` alone is **not unique** -- 2015 through 2022 each exist as both a
          calendar year and a CDC survey cycle. Joins `dim_period.period_id`.
      - name: year_start
        data_type: smallint
        description: >
          First year of the reporting window.
      - name: year_end
        data_type: smallint
        description: >
          Last year of the reporting window. Equal to `year_start` for a single-year period.
      - name: period_grain
        data_type: varchar
        description: >
          Which cadence this row is reported at. Annual and survey-cycle sources stay annual and
          survey-cycle; nothing here may be presented at a finer one.
      - name: spans_multiple_years
        data_type: boolean
        description: >
          TRUE where the period covers several years. A multi-year estimate describes its whole
          window and must never be plotted as a point on its final year.
      - name: location_abbr
        data_type: varchar
        description: >
          CDC's location code. Mixes states, DC, territories, census regions and the nation -- see
          `location_kind` before aggregating.
      - name: location_desc
        data_type: varchar
        description: >
          Location name as CDC publishes it.
      - name: location_kind
        data_type: varchar
        description: >
          `state` - `district` - `territory` - `census_region` - `national`. `locationabbr`
          mixes all five **as peers**, so summing it counts every state up to three times.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'state'
                  - 'district'
                  - 'territory'
                  - 'census_region'
                  - 'national'
                  - 'other'
      - name: is_michigan
        data_type: boolean
        description: >
          The Michigan lens, applied at the point of use rather than baked into the grain.
          National rows are retained so Michigan has a benchmark.
      - name: class_id
        data_type: varchar
        description: >
          CDC class code -- `C06` Cognitive Decline, `C07` Caregiving, `C03` Screenings and
          Vaccines.
      - name: class
        data_type: varchar
        description: >
          CDC indicator class, the top level of its taxonomy.
      - name: topic
        data_type: varchar
        description: >
          CDC indicator topic, one level below class.
      - name: question_id
        data_type: varchar
        description: >
          CDC question code. Joins `seed_cdc_indicator_catalog`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('seed_cdc_indicator_catalog')
                field: question_id
      - name: question
        data_type: varchar
        description: >
          CDC's own full question wording, as published.
      - name: indicator_family
        data_type: varchar
        description: >
          `cognitive_decline` · `caregiving` · `screening` · `overall_health` ·
          `nutrition_activity` · `substance_use` · `mental_health`.
      - name: short_label
        data_type: varchar
        description: >
          A chart-length label for the indicator, from the seed. CDC's own wording runs to a
          paragraph.
      - name: higher_is_better
        data_type: boolean
        description: >
          From `seed_cdc_indicator_catalog`, and **NULL where CDC's wording does not settle the
          direction**. Two questions break their own class: `Q42` sits in Cognitive Decline but
          asks whether decline was discussed with a professional, where higher is better, and
          `Q22` sits in Screenings but reports blood-pressure prevalence, where it is worse.
      - name: is_cognitive_decline
        data_type: boolean
        description: >
          The Cognitive Decline class, which HLT-E1 draws on.
      - name: is_caregiving
        data_type: boolean
        description: >
          The Caregiving class, which HLT-E4 draws on. **The only class carrying CDC's 2019
          comparability break.**
      - name: is_screening
        data_type: boolean
        description: >
          The Screenings and Vaccines class, which HLT-E5's capacity side draws on.
      - name: age_group
        data_type: varchar
        description: >
          `50-64 years` - `65 years or older` - `Overall`. This file covers adults **50 and
          older**, not 45 and older.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - '50-64 years'
                  - '65 years or older'
                  - 'Overall'
      - name: stratification
        data_type: varchar
        description: >
          The second stratification dimension -- a race/ethnicity or sex band, or `Overall` where
          the cell is unstratified.
      - name: stratification_category
        data_type: varchar
        description: >
          Which dimension the second stratification is on -- `Race/Ethnicity`, `Sex`, or
          `Overall`.
      - name: is_overall_age_group
        data_type: boolean
        description: >
          The `Overall` age stratum rather than 50-64 or 65-plus. Combining all three double
          counts.
      - name: is_unstratified_second_dimension
        data_type: boolean
        description: >
          TRUE on the `Overall` cells. Summing across the stratified ones double counts the
          population.
      - name: data_value_type
        data_type: varchar
        description: >
          `Percentage` or `Mean`. The two are not interchangeable and must never share an axis.
      - name: data_value_unit
        data_type: varchar
        description: >
          The unit the value is in.
      - name: data_value
        data_type: double
        description: >
          The published estimate. **A survey estimate with no denominator in this file, so it
          cannot be summed or averaged across places or strata** -- it is valid only at the grain
          CDC published it.
      - name: low_confidence_limit
        data_type: double
        description: >
          Lower confidence limit as published.
      - name: high_confidence_limit
        data_type: double
        description: >
          Upper confidence limit as published.
      - name: is_suppressed
        data_type: boolean
        description: >
          No value published. A different question from `has_footnote`: a footnote can also
          annotate a value that is present.
      - name: has_confidence_interval
        data_type: boolean
        description: >
          Both limits are present. A comparison without them is not defensible: this is a
          self-reported telephone survey and its state estimates carry real sampling error.
      - name: footnote_symbol
        data_type: varchar
        description: >
          CDC's footnote marker on this cell.
      - name: footnote_text
        data_type: varchar
        description: >
          What the footnote says, in CDC's own words.
      - name: is_not_comparable_pre_2019
        data_type: boolean
        description: >
          CDC's `**` footnote: the survey questions changed, so an estimate from 2019 on cannot
          be compared with an earlier one. 1,057 valued rows carry it, **every one of them in
          the Caregiving class** -- nationally the dementia-caregiving question jumps 13.6 to
          28.5 across that boundary for this reason alone.
      - name: is_fewer_than_50_states_reporting
        data_type: boolean
        description: >
          CDC's `#` footnote: this national estimate was built from an incomplete set of states.
      - name: is_regional_estimate
        data_type: boolean
        description: >
          CDC's `&` footnote: a census-region estimate that may not represent every state in the
          region.

  - name: fct_hlt_medicare_service_county
    description: >
      **HLT-E2.** Michigan county use of long-term-care services against the national rate.
      **This is not a dementia measure.** CMS retired the only public file carrying dementia
      prevalence at county grain effective 2026-06-15 and the question was re-scoped keeping its
      ID; skilled nursing, home health, hospice, inpatient rehabilitation and long-term care
      hospital use are a long-term-care burden measure, dementia is one driver of that burden
      among others, and no number here can support a claim about dementia. **A row is a
      geographic aggregate, never a beneficiary**, and the spending is **fee-for-service only**
      -- Medicare Advantage beneficiaries are counted but their utilization is not in this file.
      Both sides of every comparison are all-ages, because CMS publishes county rows at that age
      level only.
    columns:
      - name: measure_year
        data_type: smallint
        description: >
          Calendar year of the CMS measure. Annual is the only cadence this file has.
      - name: period_key
        data_type: varchar
        description: >
          The period this row describes, as text. `YYYY-MM` at month grain, `YYYY` at year grain,
          and the cycle label at survey-cycle grain.
      - name: period_id
        data_type: varchar
        description: >
          The single-column key a BI relationship needs. `grain:period_key`, because
          `period_key` alone is **not unique** -- 2015 through 2022 each exist as both a
          calendar year and a CDC survey cycle. Joins `dim_period.period_id`.
      - name: period_grain
        data_type: varchar
        description: >
          Which cadence this row is reported at. Annual and survey-cycle sources stay annual and
          survey-cycle; nothing here may be presented at a finer one.
      - name: county_fips
        data_type: varchar
        description: >
          Five-digit state+county FIPS. Joins `dim_geography_county`. NULL where the publisher
          reported no county, which is a real category and not a load failure.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography_county')
                field: county_fips
      - name: county_name
        data_type: varchar
        description: >
          County name without the state suffix, for a chart axis. The unassigned bucket reads
          `XX-UNKNOWN` rather than blank.
      - name: cms_county_label
        data_type: varchar
        description: >
          CMS's own county label, `MI-Alcona` style. Kept beside the conformed name so a figure
          can be traced back to the published file.
      - name: is_michigan
        data_type: boolean
        description: >
          The Michigan lens, applied at the point of use rather than baked into the grain.
          National rows are retained so Michigan has a benchmark.
      - name: is_unassigned_county
        data_type: boolean
        description: >
          The `26000` / `MI-UNKNOWN` bucket -- beneficiaries whose county could not be assigned.
          Eleven rows, one per year, real people. A county rollup includes them explicitly or
          excludes them explicitly, never by accident.
      - name: age_level
        data_type: varchar
        description: >
          Always `All`. CMS publishes county rows at that level only, so the national benchmark
          is taken at `All` too -- stated as a column rather than assumed.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'All'
      - name: service_code
        data_type: varchar
        description: >
          CMS service category code. Joins `seed_cms_service_category`.
        data_tests:
          - relationships:
              arguments:
                to: ref('seed_cms_service_category')
                field: service_code
      - name: service_name
        data_type: varchar
        description: >
          Readable service category name.
      - name: is_long_term_care
        data_type: boolean
        description: >
          Skilled nursing, home health, hospice, inpatient rehabilitation and long-term care
          hospital. **This is HLT-E2's own slice** -- now a `WHERE` clause rather than a filter
          baked into the model, since all twenty service categories are carried. A care-burden
          grouping and **not a dementia measure**.
      - name: measure_kind
        data_type: varchar
        description: >
          Which question the number answers: `per_capita` dollars per fee-for-service beneficiary,
          or `user_pct` share of beneficiaries who used the service. **Not interchangeable.**
      - name: is_standardized
        data_type: boolean
        description: >
          The payment has geographic wage and payment-policy differences removed. **The single
          easiest invisible error in this track** -- only standardized payments make a
          Michigan-versus-national comparison mean anything, and the unstandardized twin measures
          something real and different.
      - name: source_column
        data_type: varchar
        description: >
          CMS's own column name, and the only unique key of a measure: six services publish both
          covered *stays* and covered *days* per 1,000, which share a service code, a measure kind
          and a standardization flag. Also what lets a figure be traced back to the published
          file.
      - name: county_value
        data_type: double
        description: >
          The county's value for this service and measure. NULL where CMS suppressed the cell.
      - name: national_value
        data_type: double
        description: >
          The national figure for the same period and measure, carried beside the local one so a
          benchmark needs no second query.
      - name: ratio_to_national
        data_type: double
        description: >
          County value over the national value. Below 1 means the county uses less than the
          nation. **NULL for `amount` and `user_count`**, which are absolute totals: a county over
          the nation there is roughly one three-thousandth, a number that looks like a benchmark
          and is not one. Recompute from `county_value` and `national_value` before aggregating.
      - name: gap_to_national
        data_type: double
        description: >
          County value minus the national value, in the measure's own units. **NULL for `amount`
          and `user_count`** -- subtracting a nation's dollars from a county's returns the nation,
          not a gap.
      - name: is_suppressed
        data_type: boolean
        description: >
          CMS withheld a small cell. **Not zero and not absent** -- see `is_true_zero`.
      - name: is_true_zero
        data_type: boolean
        description: >
          The service was published as genuinely unused. Long-term care hospitals carry 125 of
          these across Michigan's county-years alongside 462 suppressed cells, which is why the
          two can never be collapsed into one another.
      - name: national_is_suppressed
        data_type: boolean
        description: >
          CMS suppressed the national benchmark for this service and year.
      - name: service_suppressed_cells
        data_type: bigint
        description: >
          How many of this service's Michigan county-years CMS withheld.
      - name: service_suppressed_pct
        data_type: double
        description: >
          The same as a percentage of the service's 924 county-years.
      - name: is_small_cell_service
        data_type: boolean
        description: >
          A third or more of this service's Michigan county-years are suppressed, so it will not
          support a county ranking. True for long-term care hospitals, where **half** the cells
          are withheld, and for inpatient rehabilitation.
      - name: ma_participation_rate
        data_type: double
        description: >
          Carried on every row because the spending is fee-for-service: a county with high
          Medicare Advantage penetration looks different for reasons unrelated to cost of care.
      - name: ffs_beneficiary_denominator
        data_type: double
        description: >
          Original-Medicare beneficiary count, and the correct denominator for anything per-capita
          here, because the spending is fee-for-service only.

  - name: fct_hlt_medicare_cost_annual
    description: >
      **HLT-E3.** Standardized Medicare cost per fee-for-service beneficiary by jurisdiction,
      year and age level, nominal and in constant dollars. **This is not a dementia measure** --
      the question originally asked what a beneficiary with dementia costs against one without,
      the source carrying that was retired by CMS effective 2026-06-15, and what remains has no
      condition dimension whatever. A state question rather than a county one, because the
      65-and-over slice exists only at state and national level. **The three age levels double
      count**: `<65` and `>=65` sum to their own `All`. Spending is fee-for-service only.
    columns:
      - name: measure_year
        data_type: smallint
        description: >
          Calendar year of the CMS measure. Annual is the only cadence this file has.
        data_tests:
          - not_null
      - name: period_key
        data_type: varchar
        description: >
          The period this row describes, as text. `YYYY-MM` at month grain, `YYYY` at year grain,
          and the cycle label at survey-cycle grain.
      - name: period_id
        data_type: varchar
        description: >
          The single-column key a BI relationship needs. `grain:period_key`, because
          `period_key` alone is **not unique** -- 2015 through 2022 each exist as both a
          calendar year and a CDC survey cycle. Joins `dim_period.period_id`.
      - name: period_grain
        data_type: varchar
        description: >
          Which cadence this row is reported at. Annual and survey-cycle sources stay annual and
          survey-cycle; nothing here may be presented at a finer one.
      - name: geo_level
        data_type: varchar
        description: >
          `State` or `National`. County is deliberately absent: CMS publishes the 65-and-over
          slice at these two levels only.
      - name: geo_code
        data_type: varchar
        description: >
          Two-digit state FIPS. NULL on the National row and on CMS's own `Territory` and `ZZ`
          aggregates.
      - name: geo_description
        data_type: varchar
        description: >
          CMS's own label -- a state abbreviation, `National`, or one of its two aggregate rows.
      - name: state_name
        data_type: varchar
        description: >
          Full state name as published.
      - name: is_jurisdiction
        data_type: boolean
        description: >
          False for `Territory` and `ZZ`, CMS's own aggregates at State level, both published
          with a NULL geo_code. Kept rather than dropped, so a total still reconciles.
      - name: is_michigan
        data_type: boolean
        description: >
          The Michigan lens, applied at the point of use rather than baked into the grain.
          National rows are retained so Michigan has a benchmark.
      - name: age_level
        data_type: varchar
        description: >
          **Filter to one.** `<65` and `>=65` sum to their own `All`, so combining them returns
          a jurisdiction total at twice its true size. HLT-E3 is the `>=65` slice.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'All'
                  - '<65'
                  - '>=65'
      - name: cost_per_capita
        data_type: double
        description: >
          Standardized Medicare payment per fee-for-service beneficiary, nominal dollars.
          Standardized means geographic wage and payment-policy differences are removed, which is
          what makes a cross-state comparison mean anything.
      - name: national_cost_per_capita
        data_type: double
        description: >
          The same measure for the nation in the same year and age level.
      - name: gap_to_national
        data_type: double
        description: >
          Local value minus national, in the measure's own units. Positive means above national,
          which is not the same as better.
      - name: cost_per_capita_constant
        data_type: double
        description: >
          Cost per beneficiary in constant dollars of the deflator base year, via CPI-U's annual
          average.
      - name: national_cost_per_capita_constant
        data_type: double
        description: >
          The national figure in constant dollars.
      - name: gap_to_national_constant
        data_type: double
        description: >
          Michigan sat **$250 above** national for 65-and-over beneficiaries in 2019 and **$374
          below** in 2024: the gap changed sign, crossing zero in 2022. A movement in relative
          standardized cost, and not a statement about dementia or quality of care.
      - name: constant_dollar_base_year
        data_type: integer
        description: >
          The year all constant-dollar figures are restated to. One project variable, so every
          deflated measure in the repo moves together.
      - name: ma_participation_rate
        data_type: double
        description: >
          Share of beneficiaries in Medicare Advantage. Carried on every row because their
          utilization is **not in this file**: a high-MA geography differs for reasons unrelated
          to cost of care.
      - name: ffs_beneficiary_denominator
        data_type: double
        description: >
          Original-Medicare beneficiary count, and the correct denominator for anything per-capita
          here, because the spending is fee-for-service only.
      - name: benes_total_cnt
        data_type: double
        description: >
          All Medicare beneficiaries in the geography, fee-for-service and Medicare Advantage
          together. **Not the spending denominator** -- see `ffs_beneficiary_denominator`.
      - name: bene_avg_age
        data_type: double
        description: >
          Average beneficiary age, a compositional control: an older population costs more without
          anything being wrong.
      - name: bene_dual_eligible_pct
        data_type: double
        description: >
          Share dually eligible for Medicare and Medicaid -- the other major compositional driver
          of cost.
      - name: is_suppressed
        data_type: boolean
        description: >
          The publisher withheld this value. **Not zero and not missing data** -- suppression is
          information about a small cell.

  - name: fct_hlt_mi_population_65_plus
    description: >
      **HLT-E5, the need side.** Michigan's 65-and-over population by county and ACS vintage.
      **These are estimates, not projections** -- ACS measures the population that already
      exists, and nothing in this repo forecasts. Overlapping vintages are not a time series:
      consecutive ones share four years of sample, so only every fifth is independent and
      `is_non_overlapping_with_prior` marks those. Vintages before 2017 are absent because
      Census restructured the S0101 table that year and the column means median age before it.
    columns:
      - name: vintage
        data_type: varchar
        description: >
          ACS 5-year vintage, as text.
      - name: period_id
        data_type: varchar
        description: >
          The single-column key a BI relationship needs. `grain:period_key`, because
          `period_key` alone is **not unique** -- 2015 through 2022 each exist as both a
          calendar year and a CDC survey cycle. Joins `dim_period.period_id`.
      - name: vintage_year
        data_type: smallint
        description: >
          ACS vintage as a number -- the final year of its five-year window.
      - name: vintage_window_start
        data_type: smallint
        description: >
          First year of the five-year sample window.
      - name: vintage_window_end
        data_type: smallint
        description: >
          Last year of the five-year sample window.
      - name: vintage_label
        data_type: varchar
        description: >
          The window written out, `2020-2024` style. Calling that vintage '2024 population'
          overstates it.
      - name: county_fips
        data_type: varchar
        description: >
          Five-digit state+county FIPS. Joins `dim_geography_county`. NULL where the publisher
          reported no county, which is a real category and not a load failure.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography_county')
                field: county_fips
      - name: county_name
        data_type: varchar
        description: >
          County name without the state suffix, for a chart axis. The unassigned bucket reads
          `XX-UNKNOWN` rather than blank.
      - name: is_michigan
        data_type: boolean
        description: >
          The Michigan lens, applied at the point of use rather than baked into the grain.
          National rows are retained so Michigan has a benchmark.
      - name: population_65_plus
        data_type: bigint
        description: >
          Population aged 65 and over, the Census Bureau's own `S0101` figure rather than a sum of
          age components. **An estimate of the population that already exists, not a projection.**
          Only vintages from 2017 appear: Census restructured the table that year and the line
          means median age before it.
        data_tests:
          - not_null
      - name: population_65_plus_margin
        data_type: bigint
        description: >
          Published margin of error. NULL where ACS annotated a controlled estimate rather than
          measuring one.
      - name: is_controlled_estimate
        data_type: boolean
        description: >
          ACS controlled this estimate to an external total, so no margin applies. The annotation
          is `-555555555`, which averaged as a number would be catastrophic.
      - name: state_population_65_plus
        data_type: hugeint
        description: >
          Michigan's 65-and-over total for the same vintage, carried so a county share needs no
          second query.
      - name: counties_reporting
        data_type: bigint
        description: >
          Michigan counties present in this vintage. 83 throughout.
      - name: county_share_of_state_pct
        data_type: double
        description: >
          This county's share of Michigan's 65-and-over population. Recompute from the two
          population columns before aggregating.
      - name: is_non_overlapping_with_prior
        data_type: boolean
        description: >
          This vintage's five-year window shares no sample year with the previous one. Only
          these may be differenced; consecutive vintages mostly re-measure the same responses.

  - name: rpt_hlt_need_vs_capacity
    description: >
      **HLT-E5.** Michigan's 65-and-over population growth beside the direction of each
      screening and care indicator. The two are on different scales -- a percentage change in a
      count against a movement in percentage points of a survey estimate -- so only their
      **directions** are compared and no ratio between them is published. The ACS window and the
      CDC cycle never coincide, which `windows_are_aligned` states per row. Neither side
      measures dementia.
    columns:
      - name: question_id
        data_type: varchar
        description: >
          CDC question code. Joins `seed_cdc_indicator_catalog`.
        data_tests:
          - not_null
      - name: question
        data_type: varchar
        description: >
          CDC's own full question wording, as published.
      - name: class_id
        data_type: varchar
        description: >
          CDC class code -- `C06` Cognitive Decline, `C07` Caregiving, `C03` Screenings and
          Vaccines.
      - name: indicator_family
        data_type: varchar
        description: >
          `cognitive_decline` · `caregiving` · `screening` · `overall_health` ·
          `nutrition_activity` · `substance_use` · `mental_health`.
      - name: short_label
        data_type: varchar
        description: >
          A chart-length label for the indicator, from the seed. CDC's own wording runs to a
          paragraph.
      - name: higher_is_better
        data_type: boolean
        description: >
          Whether a rise in this indicator is good news. **NULL where CDC's wording does not
          settle it** -- caregiving prevalence is genuinely two-sided -- and every direction
          downstream is NULL when it is.
      - name: age_group
        data_type: varchar
        description: >
          `50-64 years` · `65 years or older` · `Overall`. This source covers adults **50 and
          older**, not 45 and older.
      - name: from_vintage
        data_type: smallint
        description: >
          The earlier ACS vintage in the growth comparison.
      - name: to_vintage
        data_type: smallint
        description: >
          The later ACS vintage in the growth comparison.
      - name: population_window_from
        data_type: varchar
        description: >
          The earlier vintage's five-year sample window.
      - name: population_window_to
        data_type: varchar
        description: >
          The later vintage's five-year sample window.
      - name: population_from
        data_type: hugeint
        description: >
          Michigan's 65-and-over population in the earlier window.
      - name: population_to
        data_type: hugeint
        description: >
          Michigan's 65-and-over population in the later window.
      - name: population_change
        data_type: hugeint
        description: >
          Change in people between the two windows.
      - name: population_change_pct
        data_type: double
        description: >
          Michigan's 65-and-over population grew **12.6%** between the 2015-2019 and 2020-2024
          windows.
      - name: windows_are_non_overlapping
        data_type: boolean
        description: >
          Proof rather than assertion that the two ACS windows share no sample year.
      - name: indicator_from_cycle
        data_type: varchar
        description: >
          The earliest usable CDC cycle for this indicator in Michigan.
      - name: indicator_to_cycle
        data_type: varchar
        description: >
          The latest usable CDC cycle for this indicator in Michigan.
      - name: indicator_window
        data_type: varchar
        description: >
          The indicator's own comparison window, which does not coincide with the population's.
      - name: cycles_available
        data_type: bigint
        description: >
          How many single-year cycles Michigan published for this indicator. Fewer than two means
          no comparison.
      - name: indicator_from_value
        data_type: double
        description: >
          The indicator at the start of its window.
      - name: indicator_to_value
        data_type: double
        description: >
          The indicator at the end of its window.
      - name: indicator_change_pp
        data_type: double
        description: >
          Percentage **points**, not percent, and not comparable in magnitude to
          `population_change_pct`. Only the directions are compared.
      - name: straddles_2019_break
        data_type: boolean
        description: >
          An endpoint carries CDC's 2019 comparability break, which disqualifies the comparison.
      - name: indicator_direction
        data_type: varchar
        description: >
          `improving` · `deteriorating` · `no significant change` · `not comparable`. CI-aware.
      - name: windows_are_aligned
        data_type: boolean
        description: >
          False on every row: an ACS 5-year window and a CDC survey cycle never coincide.
          Published so a reader sees the mismatch at the point of use.
      - name: need_vs_capacity_verdict
        data_type: varchar
        description: >
          `need outpacing capacity` - `capacity keeping pace` - `need not growing` - `not
          comparable`. NULL where the indicator's polarity is undefined.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'need outpacing capacity'
                  - 'capacity keeping pace'
                  - 'need not growing'
                  - 'not comparable'
