# The semantic layer. One dbt project, three separate domains.
#
# `platform/` ingests and proves; `transform/` models; `projects/` documents and (session 3)
# delivers. Track separation lives in the directory tree -- `models/staging/<track>/`,
# `models/marts/<track>/` -- and is enforced by a test rather than by convention. See
# CLAUDE.md section 1: the separation is the point.
#
# It sits beside `platform/` rather than inside it for one concrete reason as well as the
# tidy one: `platform/` is on `sys.path` (CLAUDE.md section 5), and nothing about a dbt
# project should be importable.
#
# Each layer's config arrives in the PR that adds that layer's first model, because dbt
# warns about configuration paths matching no resource -- and because that is where the
# reasoning for it is worth reading.

name: bi_portfolio
version: "1.0.0"
config-version: 2
profile: bi_portfolio

model-paths: ["models"]
macro-paths: ["macros"]
# `platform/reference/state_codes.csv` is seeded where it already lives rather than copied
# into `seeds/`. It is the single state reference in the repo -- `ingest.common.load_state_codes`
# reads the same file, and every partition check in L1 rests on it -- so a second copy here
# would be a second thing to keep in step.
seed-paths: ["seeds", "../platform/reference"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

flags:
  # dbt posts an anonymous usage event to its own endpoint on every invocation. CI never
  # calls an external API -- CLAUDE.md section 6 states that without an exception, and a
  # telemetry POST is an external API call whatever it carries. Off everywhere, not just
  # in CI, so the local and CI runs are the same run.
  send_anonymous_usage_stats: false

models:
  bi_portfolio:
    +persist_docs:
      relation: true
      columns: true
    # Conformed dimensions are tables: every mart joins them, and they are small enough
    # that recomputing them on each query would cost more than storing them.
    #
    # Which layers get to be tables is a disk decision rather than a taste one. DuckDB does
    # not reclaim freed blocks in place -- repeated CREATE OR REPLACE grew this warehouse to
    # 15 GB in session 1 before a rebuild brought it back to 7.5 -- so every layer
    # materialised as a table grows the file on each `dbt build`. Staging is a rename-and-cast
    # over raw and costs nothing to recompute, so it will be a view when it lands in PR 4;
    # marts are tables because Power BI reads them, and nothing else needs to be.
    conformed:
      +materialized: table
      +schema: conformed
    staging:
      +materialized: view
      +schema: stg
    intermediate:
      +materialized: view
      +schema: int
    # Marts are tables because Power BI reads them in session 3, and because they are the
    # only layer whose shape is a promise to something outside this project.
    marts:
      +materialized: table
      +contract:
        enforced: true
      insurance:
        +schema: mart_ins
      fintech:
        +schema: mart_fin
      health:
        +schema: mart_hlt

seeds:
  bi_portfolio:
    +schema: seeds
    # Codes stay text, per seed rather than project-wide -- a `+column_types` naming a column
    # a seed does not have is a warning on every run. The reason is leading zeros: Alaska is
    # `02`, and a FIPS dbt helpfully typed as an integer silently stops joining raw, where
    # every key is a string by rule.
    seed_areas:
      +column_types:
        state_fips: varchar
    seed_county_exceptions:
      +column_types:
        county_fips: varchar
    seed_survey_cycles:
      +column_types:
        cycle_key: varchar
    state_codes:
      +column_types:
        state_fips: varchar
        census_region: varchar
        census_division: varchar

vars:
  # The latest CPI-U annual average BLS has published. Every constant-dollar measure in the
  # repo restates to this year, so moving it moves all of them together -- which is the point
  # of it being one variable rather than a literal in each mart.
  deflator_base_year: 2025
  # How long after a declared incident ends a flood loss may still be attributed to it.
  # INS-E3's event-driven share moves with this, which is why it is a variable and why the
  # drill bank asks for 30, 60 and 90 rather than a single number.
  event_attribution_grace_days: 30
  # A CFPB month is publication-complete when the share of its complaints still awaiting a
  # company response falls below this. Measured rather than assumed: the pending share runs
  # 0.06% in May 2026, 17.7% in June and 54.9% in July, so the boundary is visible in the
  # data and moves on its own as the archive refreshes.
  publication_pending_threshold_pct: 1.0
  # The ACS vintage pair HLT-E5 measures 65+ growth across. Consecutive 5-year vintages share
  # four years of sample, so only every fifth is independent -- 2015-2019 against 2020-2024 is
  # the most recent pair that shares none. Both are variables because moving one without the
  # other silently reintroduces the overlap the comparison exists to avoid, and a test asserts
  # the two windows do not touch.
  acs_growth_from_vintage: 2019
  acs_growth_to_vintage: 2024
